<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Leaflet Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    var map = L.map('map', {zoomControl: false}).setView([52.349, -3.822], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);
    map.on('dragend', () => {
        map.eachLayer(layer => {
            if (layer instanceof L.TileLayer) {
                layer.redraw();
            }
        });
    });//improvement on grey tiless but no work still, then alot better when changed to drag end



    L.control.zoom({
        position: 'bottomleft'
    }).addTo(map);

    let markers = []; // store all markers
    //band in param// lightblue, blue, darkblue, purple
    function placeBand(lat, lng, band) {
        if (band === 1){
            L.circleMarker([lat, lng], {
                radius: 8,
                color: "blue",
                fillColor: "blue",
                fillOpacity: 1
            }).addTo(map)
        } else if (band === 2){
            L.circleMarker([lat, lng], {
                radius: 10,
                color: "darkblue",
                fillColor: "darkblue",
                fillOpacity: 1
            }).addTo(map)
        } else if (band === 3) {
            L.circleMarker([lat, lng], {
                radius: 12,
                color: "purple",
                fillColor: "purple",
                fillOpacity: 1
            }).addTo(map)
        } else if (band === 4){
            L.circleMarker([lat, lng], {
                radius: 14,
                color: "darkpurple",
                fillColor: "darkpurple",
                fillOpacity: 1
            }).addTo(map)
        }

    }
    function placeMarker(lat, lng, address, time) {
        const marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup(address + ": " + time);

        markers.push(marker);
    }
    function placeOrigin(lat, lng, address) {
        const marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup(address);

        markers.push(marker);
    }
    function removeMarkerByLatLng(lat, lng) {
        for (let i = 0; i < markers.length; i++) {
            const pos = markers[i].getLatLng();

            if (pos.lat === lat && pos.lng === lng) {
                markers[i].remove();
                markers.splice(i, 1);
                break;
            }
        }
    }
    function removeAllBands(){
        map.eachLayer(layer => {
            if (layer instanceof L.Circle || layer instanceof L.CircleMarker) {
                map.removeLayer(layer);
            }
        });
    }
</script>
</body>
</html>
